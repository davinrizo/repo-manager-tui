[package]
name = "repo-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal UI for finding code repositories and reclaiming the disk space they use"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
ratatui = "0.30.2"
rayon = "1.12.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
match_same_arms = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
